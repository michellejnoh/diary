<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>diary</title>
<meta name="theme-color" content="#D5D7CE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="diary">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" id="appcss" href="style.css?v=7">
</head>
<body>
<div id="app"></div>

<script type="module">
// Loader. Watches app.js and style.css on the server.
// When either changes, it swaps the new code in without reloading the page.
const root = document.getElementById("app");
const state = {};            // survives code swaps (route, scroll, open photo)
let unmount = null;
const sigs = {};

async function signature(path) {
  try {
    const r = await fetch(`${path}?t=${Date.now()}`, { method: "HEAD", cache: "no-store" });
    if (!r.ok) return null;
    return r.headers.get("etag") || r.headers.get("last-modified") || r.headers.get("content-length");
  } catch { return null; }
}

async function loadApp() {
  const mod = await import(`./app.js?v=${Date.now()}`);
  if (unmount) await unmount();
  unmount = await mod.mount(root, state);
}

function swapCSS() {
  const old = document.getElementById("appcss");
  const link = document.createElement("link");
  link.rel = "stylesheet";
  link.href = `style.css?v=${Date.now()}`;
  const done = () => { document.querySelectorAll('link[rel="stylesheet"]').forEach(l => l !== link && l.remove()); link.id = "appcss"; };
  link.onload = done; link.onerror = done;
  old.after(link);
}

async function check() {
  const [js, css] = await Promise.all([signature("app.js"), signature("style.css")]);
  if (css && sigs.css && css !== sigs.css) swapCSS();
  if (js && sigs.js && js !== sigs.js) {
    try { await loadApp(); }
    catch (e) { console.error("Live update failed, reloading once", e); location.reload(); return; }
  }
  if (css) sigs.css = css;
  if (js) sigs.js = js;
}
window.__diaryCheck = check;

try { await loadApp(); } catch (e) { console.error(e); root.textContent = "diary couldn’t start. Reload the page."; }
check();
setInterval(() => { if (document.visibilityState === "visible") check(); }, 30000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") check(); });
</script>
</body>
</html>
